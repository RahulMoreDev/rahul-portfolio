<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="jarvisGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00e5ff" />
      <stop offset="80%" stop-color="#005577" />
      <stop offset="100%" stop-color="#040810" />
    </radialGradient>
    <linearGradient id="coilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#0077aa" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Base -->
  <circle cx="50" cy="50" r="48" fill="#040810" stroke="#00e5ff" stroke-width="2" />
  
  <!-- Outer Telemetry Ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="8 4 2 4" opacity="0.8" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.4" />

  <!-- 10 Arc Reactor Energy Coils -->
  <g stroke="#00e5ff" stroke-width="1.2" opacity="0.95">
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(36 50 50)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(72 50 50)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(108 50 50)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(144 50 50)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(180 50 50)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(216 50 50)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(252 50 50)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(288 50 50)" />
    <rect x="47" y="9" width="6" height="9" rx="1.5" fill="url(#coilGrad)" transform="rotate(324 50 50)" />
  </g>

  <!-- Middle Retaining Ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#jarvisGlow)" />
  <circle cx="50" cy="50" r="23" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="6 3" opacity="0.75" />

  <!-- Inner Triangular Reactor Core Structure -->
  <polygon points="50,29 68,61 32,61" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round" opacity="0.9" />
  <polygon points="50,34 64,58 36,58" fill="rgba(0, 229, 255, 0.15)" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" />

  <!-- Center Hologram Power Node -->
  <circle cx="50" cy="50" r="11" fill="url(#reactorCore)" filter="url(#jarvisGlow)" />
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" />
</svg>
