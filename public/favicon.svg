<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark circle background -->
  <circle cx="32" cy="32" r="30" fill="#040810" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Glowing ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
  <!-- Code brackets < /> -->
  <text x="32" y="27" text-anchor="middle" font-family="monospace" font-weight="900" font-size="16" fill="#00e5ff" opacity="0.6">&lt;/&gt;</text>
  <!-- RM Monogram -->
  <text x="32" y="45" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="2">RM</text>
</svg>
