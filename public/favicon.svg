<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="robotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2038" />
      <stop offset="60%" stop-color="#071322" />
      <stop offset="100%" stop-color="#030810" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8bd" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00ffc4" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Outer Circle -->
  <circle cx="50" cy="50" r="48" fill="#040810" stroke="#00e5ff" stroke-width="2.5" filter="url(#robotGlow)" />
  
  <!-- Outer Telemetry Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="8 4 2 4" opacity="0.6" />

  <!-- Robot Head Helmet -->
  <path d="M 30,36 C 30,22 70,22 70,36 L 73,56 C 73,68 62,75 50,75 C 38,75 27,68 27,56 Z" fill="url(#armorGrad)" stroke="#00e5ff" stroke-width="1.8" />

  <!-- Top Cyber Antenna / Head Crest -->
  <polygon points="46,14 54,14 52,23 48,23" fill="#00e5ff" filter="url(#robotGlow)" />
  <circle cx="50" cy="13" r="2.5" fill="#ffffff" filter="url(#robotGlow)" />

  <!-- Cyber Ear Transducers -->
  <rect x="22" y="38" width="6" height="18" rx="2" fill="#0c2038" stroke="#00e5ff" stroke-width="1.5" />
  <rect x="72" y="38" width="6" height="18" rx="2" fill="#0c2038" stroke="#00e5ff" stroke-width="1.5" />
  <line x1="24" y1="47" x2="26" y2="47" stroke="#00e5ff" stroke-width="1.5" />
  <line x1="74" y1="47" x2="76" y2="47" stroke="#00e5ff" stroke-width="1.5" />

  <!-- Robotic Visor -->
  <rect x="33" y="38" width="34" height="14" rx="4" fill="url(#visorGrad)" stroke="#ffffff" stroke-width="1" filter="url(#robotGlow)" />

  <!-- Glowing Digital Eye Code Brackets </ > inside visor -->
  <text x="50" y="49" text-anchor="middle" font-family="monospace" font-weight="900" font-size="10" fill="#040810" letter-spacing="1.5">&lt;/&gt;</text>

  <!-- Robot Face Plates & Mouth Grille -->
  <path d="M 40,60 L 60,60 L 56,68 L 44,68 Z" fill="#071322" stroke="#00e5ff" stroke-width="1" />
  <line x1="44" y1="64" x2="56" y2="64" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="2 1.5" opacity="0.85" />

  <!-- Forehead Arc Sensor Dot -->
  <circle cx="50" cy="28" r="2.2" fill="#00e5ff" filter="url(#robotGlow)" />
</svg>
